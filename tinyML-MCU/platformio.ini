; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; ESP32 DevKitC（Arduino core 2.0.14 / IDF 4.4）
;   - 必须锁 espressif32@6.6.0：本机 PlatformIO Core 是 6.2.0，
;     用无版本号的 espressif32 会解析到 7.x，生成 firmware.bin
;     那一步会报 TypeError: '_Null' + 'str'
;   - TFT 用 Adafruit ILI9341 + GFX（引脚在 src/main.cpp 里显式指定，
;     不需要 TFT_eSPI 的 User_Setup 配置）
; ============================================================
[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    spaziochirale/ArduTFLite@^1.0.2
    adafruit/Adafruit ILI9341@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.11
